name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/*.test.mjs
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - name: No em dashes in shipped text
        run: |
          if grep -rn --include='*.md' --include='*.json' --include='*.mjs' -e "$(printf '\xe2\x80\x94')" . --exclude-dir=.git --exclude-dir=node_modules; then echo "::error::em dash found"; exit 1; fi
